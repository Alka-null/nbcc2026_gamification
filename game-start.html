<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heineken - Nigeria</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .bottle-container {
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-300px) translateX(var(--sway)); opacity: 0; }
        }

        @keyframes wobble {
            0%, 100% { transform: skewX(-2deg) scaleY(1); }
            25% { transform: skewX(3deg) scaleY(0.98); }
            50% { transform: skewX(-3deg) scaleY(1.02); }
            75% { transform: skewX(2deg) scaleY(0.99); }
        }

        @keyframes foamPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes fillUp {
            0% { height: 0%; }
            100% { height: 85%; }
        }

        .liquid-surface {
            animation: wobble 2s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .liquid-group {
            transition: transform 0.8s ease-out;
        }

        .bubble-anim {
            animation: rise 3s ease-out infinite;
        }

        .foam-bubble {
            animation: foamPulse 2s ease-in-out infinite;
        }

        @keyframes fillUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(15%); }
        }

        .button-press {
            animation: buttonPress 0.3s ease;
        }

        @keyframes buttonPress {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .glass-effect {
            background: linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.1) 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    rgba(255, 255, 255, 0.1) 100%
            );
        }
        #scene-bg {
            transition: background-image 0.6s ease, opacity 0.4s ease;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        .question-pop {
            animation: popIn .35s ease-out;
        }

        @keyframes popIn {
            from { transform: translateY(10px) scale(.98); opacity: .5; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== Question Panel Enter/Leave ===== */
        .qa-enter {
            animation: qaEnter .45s cubic-bezier(.22,1,.36,1);
        }

        .qa-leave {
            animation: qaLeave .35s cubic-bezier(.4,0,.2,1);
        }

        @keyframes qaEnter {
            from {
                opacity: 0;
                transform: translateX(-24px) scale(.98);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes qaLeave {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(20px) scale(.98);
            }
        }


        /* ===== Option Hover Pop ===== */
        .option-pop {
            transition: all .18s cubic-bezier(.34,1.56,.64,1);
        }

        .option-pop:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow:
                    0 12px 24px rgba(0,0,0,.18),
                    0 0 0 3px rgba(34,197,94,.25);
        }

    </style>
</head>

         class="hidden fixed inset-0 flex items-center justify-center bg-black/60 z-50">

        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-2xl w-full mx-4 text-center border-t-8 border-red-600">

            <h2 class="text-3xl font-bold text-heineken-green mb-4">Visit Completed!</h2>
            <div class="my-6">
                    <span class="text-6xl font-bold text-green-600 flex justify-center items-center">
                        <span id="final-score">8</span><span class="text-4xl text-gray-400">/100</span> <span class="h-star text-4xl ml-2">★</span>
                    </span>
            </div>
            <p id="final-message" class="text-lg mb-8 text-gray-600 leading-relaxed">
                Message based on score.
            </p>
            <button onclick="window.location.href='index.html'" class="bg-green-800 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-lg transition duration-300 uppercase tracking-widest shadow-md">
                Restart Training
            </button>
        </div>
    </div>
</div>

<div id="feedback-modal" class="fixed inset-0 flex items-center justify-center z-50 hidden px-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 md:p-8 text-center relative border-b-8 fade-in" id="feedback-modal-content">
        <div id="feedback-icon" class="text-6xl mb-4"></div>

        <h3 id="feedback-title" class="text-2xl font-bold mb-4"></h3>

        <div id="feedback-body" class="text-gray-700 text-lg mb-8 leading-relaxed text-left bg-gray-50 p-4 rounded-lg border-l-4">
        </div>

        <button onclick="nextQuestion()" class="bg-green-800 hover:bg-green-600 text-white font-bold py-3 px-10 rounded-full text-lg transition duration-300 w-full md:w-auto uppercase tracking-wider shadow-lg">
            Continue &rarr;
        </button>
    </div>
</div>


<script>
    // --- Data Structure ---
    const gameData = [
        {
            id: 1,
            background: "images/1.png",
            question: "You arrive at Madam Chichi Bar. She looks very busy and does not immediately welcome you. What will you do?",
            options: [
                { text: "A) Jump straight into outlet checks", isCorrect: false },
                { text: "B) Greet the customer", isCorrect: true }
            ],
            consequence: {
                correct: "Greeting her sets a positive tone. You establish rapport early, which creates a positive atmosphere, and sets the stage for smoother, more effective conversations.",
                incorrect: "Jumping straight into outlet checks makes the execution feel rushed, creates zero connection, and causes you to miss key opportunities."
            },
            className: "items-end justify-start",
        },
        {
            id: 2,
            background: "images/2.png",
            question: "Do you have an objective for this call?",
            options: [
                { text: "Yes", isCorrect: true },
                { text: "No", isCorrect: false }
            ],
            consequence: {
                correct: "You enter the outlet with a clear objective, the conversation flows smoothly, and you can measure success at the end of the visit.",
                incorrect: "You arrived unfocused, the discussion drifts, and the visit lack structure and impact."
            },
            className: "items-center justify-center",
        },
        {
            id: 3,
            background: "images/bottles.png",
            question: "Which of these is a SMART objective for your visit?",
            options: [
                { text: "A) To improve volume share of Heineken 45cl in the outlet from (20% and 30%) exit February 2026.", isCorrect: true },
                { text: "B) Market share growth", isCorrect: false }
            ],
            consequence: {
                correct: "Your visit objective must be specific, measurable, achievable, relevant, and time‑bound to provide clear direction and enable you measure visit impact.",
                incorrect: "Having an objective like ‘Market share growth’ is not directional because it does not specify what must be achieved in the outlet nor fit into the SMART object model."
            },
            image: "images/growth.png",
            imageAlt: "Objective",
        },
        {
            id: 4,
            background: "images/4.png",
            question: "During outlet check, you notice Heineken 45cl is not available in the chiller. What do you do?",
            options: [
                { text: "A) Ignore", isCorrect: false },
                { text: "B) Document gaps & prioritize for discussion", isCorrect: true }
            ],
            consequence: {
                correct: "Documenting the gaps and prioritizing them for discussion shows proactive execution and help seize sales opportunity in the outlet.",
                incorrect: "Ignoring the missing brands leads to continued stockouts, lost sales, and missed opportunities that can strengthen NB grip in the outlets."
            }
        },
        {
            id: 5,
            background: "images/5.png",
            question: "To fully understand the needs of the customer regarding the missing stock, what should you do?",
            options: [
                { text: "A) Assume the outlet does not have Heineken 45cl", isCorrect: false },
                { text: "B) Use questioning and listening skills to understand why there was no Heineken 45cl", isCorrect: true }
            ],
            consequence: {
                correct: "Using effective questioning and active listening helps you uncover the real reason Heineken 45cl was missing. This ensures you address the true source of the gap.",
                incorrect: "Assuming the outlet simply doesn’t have Heineken 45cl leads to wrong conclusions, missed insights, and poor problem‑solving."
            }
        },
        {
            id: 6,
            background: "images/6.png",
            question: "You discovered the outlet ran out of Heineken 45cl due to a birthday party yesterday. What is your next action?",
            options: [
                { text: "A) Discuss replenishing Heineken 45cl ensuring the right forward stock", isCorrect: true },
                { text: "B) Ignore the gap till the next purchase", isCorrect: false }
            ],
            consequence: {
                correct: "Discussing replenishment and ensuring the right forward stock shows strong sales execution. You help the customer stay prepared for demand spikes, prevent future stockouts, and secure continuous availability.",
                incorrect: "Ignoring the gap until the next purchase allows the stockout problem to continue. You lose immediate sales, risk customer dissatisfaction, and miss an opportunity to strengthen Heineken’s presence."
            }
        },
        {
            id: 7,
            background: "images/7.png",
            question: "As you discussed, Madam Chichi nods, showing interest in the proposed quantity of Heineken 45cl. What do you do?",
            options: [
                { text: "A) Identify buying signals & gain agreement", isCorrect: true },
                { text: "B) Continue talking about the need to have the right stock", isCorrect: false }
            ],
            consequence: {
                correct: "Identifying buying signals helps you read the signages and close at the exact right moment, making your pitch land with maximum impact.",
                incorrect: "Not taking advantage of buying signals can lead to risk of losing sales opportunities because you oversold past the point of agreement."
            },
            className: "items-baseline justify-end",
        },
        {
            id: 8,
            background: "images/8.png",
            question: "Madam Chichi agreed to the quantity. What will you do now?",
            options: [
                { text: "A) Inform her to call the VSM for supply", isCorrect: false },
                { text: "B) Guide her to place the order on QuickDrinks App", isCorrect: true }
            ],
            consequence: {
                correct: "Guiding her to place the order on QuickDrinks ensures immediate execution, eliminates delays, and guarantees the agreed quantity is secured.",
                incorrect: "Telling her to call the VSM adds unnecessary steps, delays the order, and risks losing momentum. This can lead to missed sales and weak execution."
            }
        },
        {
            id: 9,
            background: "images/9.png",
            question: "You noticed one of the NB chillers is not functioning. What do you do?",
            options: [
                { text: "A) Guide the customer to call the NB Customer Service toll free line", isCorrect: true },
                { text: "B) Direct the customer to fix the chiller on her own", isCorrect: false }
            ],
            consequence: {
                correct: "Guiding the customer to call the NB Customer Service ensures the issue is handled by the right technical team. This leads to quicker resolution and protects product quality.",
                incorrect: "Directing the customer to fix the chiller on her own is against NB asset contract agreement, may lead to delays, improper repairs, and risk product spoilage."
            },
            className: "items-end justify-center",
        },
        {
            id: 10,
            background: "images/bg.png",
            question: "After leaving the outlet, what’s the most important final step?",
            options: [
                { text: "A) Wait until next visit", isCorrect: false },
                { text: "B) Register agreements in SEM & follow up", isCorrect: true }
            ],
            consequence: {
                correct: "Registering agreements in SEM ensures proper follow‑up and keeps execution on track.",
                incorrect: "Without registration, details get forgotten, follow‑up breaks down, and execution loses momentum."
            }
        }
    ];

    // --- Game State ---
    let currentQuestionIndex = 0;
    let score = 0;
    let isWaitPhase = false;

    // --- Timer ---
    const QUIZ_DURATION = 40; // 40 seconds
    let timeRemaining = QUIZ_DURATION;
    let timerInterval = null;
    const timerDisplayEl = document.getElementById('timer-display');


    const questionImageWrapper = document.getElementById('question-image-wrapper');
    const questionImageEl = document.getElementById('question-image');
    const sceneBg = document.getElementById('scene-bg');

    const gameScreen = document.getElementById('game-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const feedbackModal = document.getElementById('feedback-modal');
    const feedbackModalContent = document.getElementById('feedback-modal-content');

    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const scoreDisplayEl = document.getElementById('score-display');
    const questionCounterEl = document.getElementById('question-counter');
    const progressBarEl = document.getElementById('progress-bar');

    const feedbackTitleEl = document.getElementById('feedback-title');
    const feedbackBodyEl = document.getElementById('feedback-body');
    const feedbackIconEl = document.getElementById('feedback-icon');

    const finalScoreEl = document.getElementById('final-score');
    const finalMessageEl = document.getElementById('final-message');

    // -- Bottle State
    // -- Bottle State - FIXED: Removed duplicate declarations
    // Current fill level in percentage (0 = empty, 100 = full)
    let currentFill = 0;

    // Bottle capacity in percentage
    const bottleCapacity = 100;

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s.toString().padStart(2,'0')}`;
    }

    function updateTimerUI() {
        timerDisplayEl.textContent = formatTime(timeRemaining);

        // color warning under 1 minute
        if (timeRemaining <= 60) {
            timerDisplayEl.classList.remove('text-white');
            timerDisplayEl.classList.add('text-red-400');
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeRemaining = QUIZ_DURATION;
        updateTimerUI();

        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerUI();

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                handleTimeUp();
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function handleTimeUp() {
        // close feedback if open
        feedbackModal.classList.add('hidden');

        // prevent further input
        isWaitPhase = true;

        // show timeout message on game over screen
        finalScoreEl.textContent = score;
        finalMessageEl.textContent =
            "Time is up! The visit was not completed within 2 minutes. Try again and execute faster next time.";

        gameScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
    }


    function animatePanelSwap(callback) {
        const panel = document.getElementById('qa-panel');

        panel.classList.remove('qa-enter');
        panel.classList.add('qa-leave');

        setTimeout(() => {
            callback(); // load new content
            panel.classList.remove('qa-leave');
            panel.classList.add('qa-enter');
        }, 260);
    }

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        currentFill = 0; // Reset fill level
        updateDisplay(); // Reset bottle display
        scoreDisplayEl.textContent = score;
        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        const currentData = gameData[currentQuestionIndex];

        // Change background
        // if (currentData.background) {
        //     sceneBg.style.backgroundImage = `url('${currentData.background}')`;
        // }
        sceneBg.style.backgroundImage = `url('${currentData.background}')`;

        // ---------- Dynamic Right Panel Classes ----------
        sceneBg.className =
            "relative w-full lg:w-3/4 min-h-screen flex bg-cover bg-center bg-no-repeat " +
            (currentData.className || "items-end justify-start");

        // ---------- Optional Question Image ----------
        if (currentData.image) {
            questionImageWrapper.classList.remove("hidden");
            questionImageEl.src = currentData.image;
            questionImageEl.alt = currentData.imageAlt || "Question visual";
        } else {
            questionImageWrapper.classList.add("hidden");
            questionImageEl.src = "";
        }

        // Update UI elements
        questionCounterEl.textContent = `${currentQuestionIndex + 1}/${gameData.length}`;
        progressBarEl.style.width = `${((currentQuestionIndex + 1) / gameData.length) * 100}%`;
        questionTextEl.textContent = currentData.question;

        // Create Option Buttons
        optionsContainerEl.innerHTML = '';
        currentData.options.forEach((option, index) => {
            const button = document.createElement('button');
            // Base classes
            button.className = `w-full text-left p-3 rounded-xl border-2 text-base font-semibold
            flex items-center
            bg-white text-green-800 border-green-800
            hover:bg-green-200
            shadow-sm
            option-pop
            opacity-0 translate-y-2`;

            // Styling: White background with green text initially
            button.classList.add('bg-white', 'text-green-800', 'border-green-800', 'hover:bg-green-200', 'shadow-sm');
            button.innerHTML = `<span class="size-6 rounded-full border-2 border-current flex items-center justify-center mr-4 text-sm font-bold">${String.fromCharCode(65 + index)}</span> ${option.text}`;
            button.onclick = () => handleAnswer(option.isCorrect);
            optionsContainerEl.appendChild(button);
            setTimeout(() => {
                button.classList.remove('opacity-0','translate-y-2');
                button.classList.add('opacity-100','translate-y-0','transition-all','duration-300');
            }, 80 * index);
        });
    }

    function handleAnswer(isCorrect) {
        if (isWaitPhase) return; // Prevent double-clicking
        isWaitPhase = true;

        const currentData = gameData[currentQuestionIndex];

        // Prepare Feedback Modal
        if (isCorrect) {
            score = Math.min(score + 10, 100);
            scoreDisplayEl.textContent = score;
            feedbackTitleEl.textContent = "Excellent Choice! ✅ +10 XP";
            feedbackTitleEl.className = "text-2xl font-bold mb-4 text-green-800";
            feedbackBodyEl.textContent = currentData.consequence.correct;
            feedbackBodyEl.className = "text-gray-800 text-lg mb-8 leading-relaxed text-left bg-green-50 p-4 rounded-lg border-l-4 border-green-800";
            feedbackIconEl.innerHTML = "👍";
            feedbackModalContent.classList.add('border-green-800');
            feedbackModalContent.classList.remove('border-red-800');

            // Calculate new fill amount Add 10 to current fill level
            currentFill = Math.min(currentFill + 10, bottleCapacity);

            // Update bottle display
            updateDisplay();

            // Create bubbles animation
            createBubbles();

        } else {
            feedbackTitleEl.textContent = "Missed Opportunity ❌ + 0 XP";
            feedbackTitleEl.className = "text-2xl font-bold mb-4 text-red-800";
            feedbackBodyEl.textContent = currentData.consequence.incorrect;
            feedbackBodyEl.className = "text-gray-800 text-lg mb-8 leading-relaxed text-left bg-red-50 p-4 rounded-lg border-l-4 border-red-800";
            feedbackIconEl.innerHTML = "⚠️";
            feedbackModalContent.classList.add('border-red-800');
            feedbackModalContent.classList.remove('border-green-800');
        }

        // Show Modal
        feedbackModal.classList.remove('hidden');
    }

    function nextQuestion() {
        feedbackModal.classList.add('hidden');
        currentQuestionIndex++;
        isWaitPhase = false;

        if (currentQuestionIndex < gameData.length) {
            animatePanelSwap(loadQuestion);
            //loadQuestion();
        } else {
            endGame();

            // Reset everything
            currentFill = 0;

            // Update display
            updateDisplay();
        }
    }

    function endGame() {
        stopTimer();
        gameScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreEl.textContent = score;

        let message = "";
        if (score === 100) {
            message = "Perfect execution! You are a true Star performer. Madam Chichi is delighted, and Heineken availability is secured.";
        } else if (score >= 70) {
            message = "Great job! A solid visit with good outcomes. Review the missed steps to make your next visit flawless.";
        } else {
            message = "There is room for improvement. Review the Heineken Steps of Visit to ensure you maximize every opportunity at the outlet.";
        }
        finalMessageEl.textContent = message;

        // Reset everything
        currentFill = 0;

        // Update display
        updateDisplay();
    }

    function restartGame() {
        stopTimer();
        gameOverScreen.classList.add('hidden');
        startGame();
    }


    // Function to update all display elements
    function updateDisplay() {
        // Calculate translateY: 100% = empty, 0% = full
        // So if currentFill is 0, translateY should be 100%
        // If currentFill is 100, translateY should be 0%
        const translateY = 100 - currentFill;

        // Get the liquid group element
        const liquidGroup = document.getElementById('liquidGroup');
        const foam = document.getElementById('foam');

        if (liquidGroup) {
            liquidGroup.style.transform = `translateY(${translateY}%)`;
        }

        // Show foam when nearly full (at 80% or more)
        if (foam && currentFill >= 80) {
            foam.style.opacity = '1';
        } else if (foam) {
            foam.style.opacity = '0';
        }
    }

    // FIXED: Proper createBubbles function
    function createBubbles() {
        const bubblesGroup = document.getElementById('bubbles');
        if (!bubblesGroup) return;

        // Create 5 new bubbles
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const bubble = document.createElementNS("http://www.w3.org/2000/svg", "circle");

                // Random position within bottle width
                const x = 50 + Math.random() * 87; // Between 50 and 137
                const r = 1.5 + Math.random() * 2;
                const sway = (Math.random() - 0.5) * 30;

                bubble.setAttribute("cx", x);
                bubble.setAttribute("cy", "350");
                bubble.setAttribute("r", r);
                bubble.setAttribute("class", "bubble bubble-anim");
                bubble.style.setProperty("--sway", sway + "px");
                bubble.style.animationDuration = (2 + Math.random() * 2) + "s";
                bubble.style.fill = "rgba(255, 255, 255, 0.7)";
                bubble.style.filter = "url(#blur)";

                bubblesGroup.appendChild(bubble);

                // Remove after animation
                setTimeout(() => {
                    if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
                }, 4000);
            }, i * 100);
        }
    }

    // Background bubble creation
    function createBackgroundBubble() {
        const bubblesGroup = document.getElementById('bubbles');
        if (!bubblesGroup) return;

        const bubble = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const x = 50 + Math.random() * 87;
        const r = 1.5 + Math.random() * 2;
        const sway = (Math.random() - 0.5) * 30;

        bubble.setAttribute("cx", x);
        bubble.setAttribute("cy", "350");
        bubble.setAttribute("r", r);
        bubble.setAttribute("class", "bubble bubble-anim");
        bubble.style.setProperty("--sway", sway + "px");
        bubble.style.animationDelay = Math.random() * 2 + "s";
        bubble.style.animationDuration = (2 + Math.random() * 2) + "s";
        bubble.style.fill = "rgba(255, 255, 255, 0.7)";
        bubble.style.filter = "url(#blur)";

        bubblesGroup.appendChild(bubble);

        setTimeout(() => {
            if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 4000);
    }

    // Start background bubbles
    setInterval(createBackgroundBubble, 300);

    document.addEventListener('DOMContentLoaded', function() {
        startGame();

        // Initialize with some bubbles for empty bottle (optional)
        createBubbles();

        // Initialize with some bubbles for empty bottle
        for (let i = 0; i < 15; i++) {
            setTimeout(createBackgroundBubble, i * 100);
        }
    })
</script>
