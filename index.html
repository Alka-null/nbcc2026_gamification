<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heineken - Nigeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center" style="background-image:url('images/bg.png')">

<!-- Overlay -->
<div class="min-h-screen bg-black/60 flex items-center justify-center px-6">

    <!-- Hero Card -->
    <div class="text-center max-w-3xl text-white">

        <p class="uppercase tracking-widest text-sm text-green-300 mb-4">
            Heineken Steps of Visit
        </p>

        <h1 class="text-3xl md:text-5xl font-bold mb-4">
            Welcome 👋
        </h1>

        <p class="text-lg md:text-xl mb-2">
            You are about to visit
        </p>

        <!-- Main Focus Element -->
        <div class="mb-6">
            <div class="divider"></div>
            <h2 class="text-5xl md:text-7xl font-bold text-white heineken-star">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-[#00A651] to-[#D4AF37]">Madam Chichi Bar</span>
            </h2>
            <div class="divider"></div>
        </div>

        <div class="bg-[#0a261e]/80 border border-heinekenGreen/40 rounded-xl p-6 max-w-2xl mx-auto mb-10">
            <p class="text-lg md:text-xl">
                Your goal is to execute a perfect sales call using the
                <span class="font-bold text-green-300">Heineken Steps of Visit</span>.
            </p>
        </div>

        <!-- CTA -->
        <button onclick="window.location.href='game-start.html'" class="uppercase bg-green-600 hover:bg-green-700 px-8 py-4 rounded-xl text-lg font-semibold shadow-lg transition">
            Start Visit
        </button>

    </div>
</div>

</body>
</html>
